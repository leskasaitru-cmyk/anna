<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000008">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Космос | Все Смешарики в открытом космосе</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden; position: fixed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: #000008;
            color: white;
            user-select: none; -webkit-user-select: none;
            touch-action: none; overscroll-behavior: none;
        }

        canvas { display: block; touch-action: none; }

        #info {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            z-index: 10; pointer-events: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
            max-width: 70vw;
        }

        h1 {
            font-size: clamp(1rem, 4vw, 1.8rem);
            margin: 0;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #ffe66d);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800; letter-spacing: 1px; line-height: 1.1;
        }

        #info p {
            margin: 5px 0 0; opacity: 0.85;
            font-size: clamp(0.65rem, 2.5vw, 0.85rem);
            color: #aaccff;
        }

        .instructions {
            position: fixed;
            bottom: max(15px, env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 18px; border-radius: 30px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            font-size: clamp(0.65rem, 2.4vw, 0.85rem);
            border: 1px solid rgba(100,180,255,0.3);
            pointer-events: none; z-index: 10; color: #cce0ff;
            box-shadow: 0 0 20px rgba(80,150,255,0.25);
            white-space: nowrap; max-width: 92vw;
            overflow: hidden; text-overflow: ellipsis;
        }

        #loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000008;
            display: flex; align-items: center; justify-content: center;
            z-index: 999; transition: opacity 0.8s;
            color: #4ecdc4;
            font-size: clamp(0.9rem, 3.5vw, 1.2rem);
            letter-spacing: 3px;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }

        @media (max-width: 480px) {
            #info p { display: none; }
            .instructions { padding: 6px 12px; font-size: 0.65rem; }
        }

        @media (max-height: 500px) {
            #info h1 { font-size: 0.95rem; }
            #info p { display: none; }
            .instructions { bottom: 8px; padding: 5px 12px; font-size: 0.65rem; }
        }
    </style>
</head>
<body>
    <div id="loading">ЗАПУСК СИСТЕМ...</div>

    <div id="info">
        <h1>СМЕШАРИКИ В КОСМОСЕ</h1>
        <p>Ракета • Луна • Шаралёт с Пином • Все Смешарики на орбите</p>
    </div>

    <div class="instructions">🖱 Вращение • Колесо/Пинч — неограниченный зум</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============================================================
        // 1. СЦЕНА, КАМЕРА, РЕНДЕР
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000008);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 100000);
        camera.position.set(0, 12, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);

        // ============================================================
        // 2. КОНТРОЛЫ
        // ============================================================
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;
        controls.enableZoom = true;
        controls.enablePan = false;
        controls.rotateSpeed = 1.0;
        controls.zoomSpeed = 1.2;
        controls.minDistance = 0.01;
        controls.maxDistance = Infinity;
        controls.target.set(0, 3, 0);
        controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_ROTATE };

        // ============================================================
        // 3. ОСВЕЩЕНИЕ
        // ============================================================
        scene.add(new THREE.AmbientLight(0x334466, 0.85));

        const sunLight = new THREE.DirectionalLight(0xfff5e0, 2.0);
        sunLight.position.set(20, 25, 15);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.set(1024, 1024);
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 100;
        sunLight.shadow.camera.left = -50;
        sunLight.shadow.camera.right = 50;
        sunLight.shadow.camera.top = 50;
        sunLight.shadow.camera.bottom = -50;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        const rimLight = new THREE.DirectionalLight(0x4466ff, 0.9);
        rimLight.position.set(-25, 10, -20);
        scene.add(rimLight);

        const fillLight = new THREE.PointLight(0x8888ff, 0.5, 100);
        fillLight.position.set(0, -10, 20);
        scene.add(fillLight);

        // ============================================================
        // 4. РАКЕТА
        // ============================================================
        const rocketGroup = new THREE.Group();
        rocketGroup.position.set(-16, 2, 0);
        scene.add(rocketGroup);

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe8e8f0, roughness: 0.3, metalness: 0.85 });
        const redMat = new THREE.MeshStandardMaterial({ color: 0xd42626, roughness: 0.4, metalness: 0.6 });
        const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.6, metalness: 0.9 });
        const metalMat = new THREE.MeshStandardMaterial({ color: 0x8899aa, roughness: 0.2, metalness: 1.0 });
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xffcc33, roughness: 0.25, metalness: 1.0 });

        const rBody = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 6, 32), bodyMat);
        rBody.castShadow = true; rBody.receiveShadow = true;
        rocketGroup.add(rBody);

        const rNose = new THREE.Mesh(new THREE.ConeGeometry(1.0, 2.2, 32), redMat);
        rNose.position.y = 4.1; rNose.castShadow = true;
        rocketGroup.add(rNose);

        const rTip = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.8, 16), metalMat);
        rTip.position.y = 5.6; rTip.castShadow = true;
        rocketGroup.add(rTip);

        [-2.5, -1.0, 0.5, 2.0].forEach((y) => {
            const ring = new THREE.Mesh(new THREE.TorusGeometry(1.02, 0.08, 12, 32), redMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = y;
            ring.castShadow = true;
            rocketGroup.add(ring);
        });

        const winRing = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.08, 12, 24), goldMat);
        winRing.position.set(0, 1.2, 0.95);
        rocketGroup.add(winRing);

        const winGlass = new THREE.Mesh(
            new THREE.CircleGeometry(0.35, 24),
            new THREE.MeshStandardMaterial({
                color: 0x66ccff, roughness: 0.05, metalness: 0.3,
                emissive: 0x004466, emissiveIntensity: 0.6, transparent: true, opacity: 0.85
            })
        );
        winGlass.position.set(0, 1.2, 1.0);
        rocketGroup.add(winGlass);

        const finShape = new THREE.Shape();
        finShape.moveTo(0, 0); finShape.lineTo(0, 1.8);
        finShape.lineTo(1.4, 0.2); finShape.lineTo(1.4, -0.3);
        finShape.lineTo(0, -0.6); finShape.lineTo(0, 0);

        const finGeo = new THREE.ExtrudeGeometry(finShape, {
            depth: 0.12, bevelEnabled: true, bevelThickness: 0.03,
            bevelSize: 0.03, bevelSegments: 2
        });
        finGeo.translate(-0.7, -1.2, -0.06);

        for (let i = 0; i < 4; i++) {
            const fin = new THREE.Mesh(finGeo, redMat);
            const a = (i / 4) * Math.PI * 2;
            fin.position.set(Math.cos(a) * 0.9, -2.5, Math.sin(a) * 0.9);
            fin.rotation.y = -a + Math.PI / 2;
            fin.castShadow = true;
            rocketGroup.add(fin);
        }

        const nozzleBase = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.3, 0.5, 32), darkMat);
        nozzleBase.position.y = -3.2; nozzleBase.castShadow = true;
        rocketGroup.add(nozzleBase);

        const nozzlePositions = [
            { x: 0.5, z: 0.5 }, { x: -0.5, z: 0.5 },
            { x: 0.5, z: -0.5 }, { x: -0.5, z: -0.5 }
        ];

        nozzlePositions.forEach((pos) => {
            const n = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.32, 0.8, 12, 1, true), darkMat);
            n.position.set(pos.x, -3.7, pos.z);
            n.castShadow = true;
            rocketGroup.add(n);
        });

        const mainNozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.7, 1.0, 20, 1, true), darkMat);
        mainNozzle.position.y = -4.0; mainNozzle.castShadow = true;
        rocketGroup.add(mainNozzle);

        const flames = [];
        function createFlame(x, z, scale) {
            const g = new THREE.Group();
            const layers = [
                { r: 0.25 * scale, h: 1.2 * scale, color: 0xffff88, op: 0.95, y: -0.6 * scale },
                { r: 0.35 * scale, h: 2.0 * scale, color: 0xff8800, op: 0.7, y: -1.0 * scale },
                { r: 0.5 * scale, h: 2.8 * scale, color: 0xff2200, op: 0.35, y: -1.4 * scale }
            ];
            layers.forEach((L) => {
                const f = new THREE.Mesh(
                    new THREE.ConeGeometry(L.r, L.h, 10),
                    new THREE.MeshBasicMaterial({
                        color: L.color, transparent: true, opacity: L.op,
                        blending: THREE.AdditiveBlending, depthWrite: false
                    })
                );
                f.rotation.x = Math.PI;
                f.position.y = L.y;
                g.add(f);
            });
            g.position.set(x, -4.4, z);
            g.userData.phase = Math.random() * Math.PI * 2;
            return g;
        }

        nozzlePositions.forEach((pos) => {
            const f = createFlame(pos.x, pos.z, 1.0);
            rocketGroup.add(f);
            flames.push(f);
        });
        const mainFlame = createFlame(0, 0, 1.6);
        rocketGroup.add(mainFlame);
        flames.push(mainFlame);

        const engineLight = new THREE.PointLight(0xff6600, 3, 12, 2);
        engineLight.position.set(0, -4.5, 0);
        rocketGroup.add(engineLight);

        // ============================================================
        // 5. ЛУНА С ПРИШЕЛЬЦАМИ
        // ============================================================
        const moonGroup = new THREE.Group();
        moonGroup.position.set(22, 0, 0);
        scene.add(moonGroup);

        const moonMesh = new THREE.Mesh(
            new THREE.SphereGeometry(4, 48, 48),
            new THREE.MeshStandardMaterial({ color: 0x9a9a9a, roughness: 0.95, metalness: 0.05 })
        );
        moonMesh.castShadow = true; moonMesh.receiveShadow = true;
        moonGroup.add(moonMesh);

        const craterMat = new THREE.MeshStandardMaterial({ color: 0x505050, roughness: 1.0 });
        const craterRimMat = new THREE.MeshStandardMaterial({ color: 0xb0b0b0, roughness: 0.9 });

        const craterData = [
            { lat: 30, lon: 20, r: 0.7 }, { lat: -20, lon: 60, r: 0.5 },
            { lat: 10, lon: -40, r: 0.9 }, { lat: -50, lon: 100, r: 0.6 },
            { lat: 60, lon: -80, r: 0.45 }, { lat: 0, lon: 140, r: 0.55 },
            { lat: -30, lon: -120, r: 0.75 }, { lat: 45, lon: 160, r: 0.4 }
        ];

        craterData.forEach((c) => {
            const lat = THREE.MathUtils.degToRad(c.lat);
            const lon = THREE.MathUtils.degToRad(c.lon);
            const R = 4;
            const x = R * Math.cos(lat) * Math.cos(lon);
            const y = R * Math.sin(lat);
            const z = R * Math.cos(lat) * Math.sin(lon);
            const pos = new THREE.Vector3(x, y, z);

            const crater = new THREE.Mesh(new THREE.SphereGeometry(c.r, 16, 16), craterMat);
            crater.position.copy(pos.clone().multiplyScalar(0.97));
            crater.scale.set(1, 1, 0.35);
            crater.lookAt(0, 0, 0);
            moonGroup.add(crater);

            const rim = new THREE.Mesh(
                new THREE.TorusGeometry(c.r * 0.95, c.r * 0.15, 6, 20),
                craterRimMat
            );
            rim.position.copy(pos.clone().multiplyScalar(0.995));
            rim.lookAt(0, 0, 0);
            rim.rotateX(Math.PI / 2);
            moonGroup.add(rim);
        });

        const alienSkins = [
            new THREE.MeshStandardMaterial({ color: 0x66ff88, roughness: 0.5, emissive: 0x113311, emissiveIntensity: 0.3 }),
            new THREE.MeshStandardMaterial({ color: 0x88ddff, roughness: 0.5, emissive: 0x112233, emissiveIntensity: 0.3 }),
            new THREE.MeshStandardMaterial({ color: 0xff88dd, roughness: 0.5, emissive: 0x331122, emissiveIntensity: 0.3 })
        ];
        const eyeMatA = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, emissive: 0x00ff88, emissiveIntensity: 0.8 });
        const antennaMatA = new THREE.MeshStandardMaterial({ color: 0xffee00, emissive: 0xffcc00, emissiveIntensity: 1.2 });

        function createAlien(skinMat, scale = 1) {
            const alien = new THREE.Group();
            const aBody = new THREE.Mesh(new THREE.SphereGeometry(0.4 * scale, 16, 16), skinMat);
            aBody.scale.set(1, 1.3, 0.9);
            aBody.position.y = 0.5 * scale;
            aBody.castShadow = true;
            alien.add(aBody);

            const aHead = new THREE.Mesh(new THREE.SphereGeometry(0.32 * scale, 16, 16), skinMat);
            aHead.scale.set(1.1, 1.0, 0.9);
            aHead.position.y = 1.1 * scale;
            aHead.castShadow = true;
            alien.add(aHead);

            for (let i = -1; i <= 1; i += 2) {
                const eye = new THREE.Mesh(new THREE.SphereGeometry(0.09 * scale, 10, 10), eyeMatA);
                eye.position.set(0.13 * i * scale, 1.14 * scale, 0.25 * scale);
                eye.scale.set(1.2, 1.5, 0.8);
                alien.add(eye);
            }

            for (let i = -1; i <= 1; i += 2) {
                const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.015 * scale, 0.015 * scale, 0.35 * scale, 6), skinMat);
                ant.position.set(0.15 * i * scale, 1.45 * scale, 0);
                ant.rotation.z = -0.3 * i;
                alien.add(ant);

                const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.06 * scale, 8, 8), antennaMatA);
                bulb.position.set(0.2 * i * scale, 1.62 * scale, 0);
                alien.add(bulb);

                const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04 * scale, 0.05 * scale, 0.5 * scale, 6), skinMat);
                arm.position.set(0.42 * i * scale, 0.6 * scale, 0);
                arm.rotation.z = i * 0.4;
                alien.add(arm);

                const hand = new THREE.Mesh(new THREE.SphereGeometry(0.07 * scale, 8, 8), skinMat);
                hand.position.set(0.55 * i * scale, 0.4 * scale, 0);
                alien.add(hand);

                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.06 * scale, 0.06 * scale, 0.35 * scale, 6), skinMat);
                leg.position.set(0.14 * i * scale, 0.18 * scale, 0);
                alien.add(leg);
            }
            return alien;
        }

        const alienPositions = [
            { lat: 25, lon: 15, scale: 1.0, rotY: 0.3 },
            { lat: -15, lon: 50, scale: 0.9, rotY: -0.8 },
            { lat: 5, lon: -30, scale: 1.1, rotY: 1.2 },
            { lat: -40, lon: 100, scale: 0.85, rotY: 2.0 },
            { lat: 50, lon: -70, scale: 0.95, rotY: -1.5 },
            { lat: 10, lon: 130, scale: 1.0, rotY: 0.7 }
        ];

        const aliens = [];
        alienPositions.forEach((a, idx) => {
            const lat = THREE.MathUtils.degToRad(a.lat);
            const lon = THREE.MathUtils.degToRad(a.lon);
            const R = 4;
            const x = R * Math.cos(lat) * Math.cos(lon);
            const y = R * Math.sin(lat);
            const z = R * Math.cos(lat) * Math.sin(lon);

            const alien = createAlien(alienSkins[idx % 3], a.scale);
            const pos = new THREE.Vector3(x, y, z).normalize().multiplyScalar(R + 0.05);
            alien.position.copy(pos);
            alien.lookAt(pos.clone().multiplyScalar(2));
            alien.rotateY(a.rotY);
            alien.userData.baseY = pos.y;
            alien.userData.phase = idx * 1.7;
            moonGroup.add(alien);
            aliens.push(alien);
        });

        // НЛО
        const ufoGroup = new THREE.Group();
        ufoGroup.position.set(0, 6, 0);
        moonGroup.add(ufoGroup);

        const ufoBody = new THREE.Mesh(
            new THREE.SphereGeometry(0.9, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2),
            new THREE.MeshStandardMaterial({ color: 0xccccdd, roughness: 0.2, metalness: 1.0, emissive: 0x334466, emissiveIntensity: 0.3 })
        );
        ufoBody.scale.set(1, 0.35, 1);
        ufoBody.castShadow = true;
        ufoGroup.add(ufoBody);

        const ufoBottom = new THREE.Mesh(
            new THREE.SphereGeometry(0.9, 20, 12, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
            new THREE.MeshStandardMaterial({ color: 0x666677, roughness: 0.3, metalness: 0.9 })
        );
        ufoBottom.scale.set(1, 0.15, 1);
        ufoGroup.add(ufoBottom);

        const ufoDome = new THREE.Mesh(
            new THREE.SphereGeometry(0.35, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2),
            new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0.05, metalness: 0.3, emissive: 0x2266aa, emissiveIntensity: 0.8, transparent: true, opacity: 0.8 })
        );
        ufoDome.position.y = 0.15;
        ufoGroup.add(ufoDome);

        const ufoLights = [];
        for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2;
            const lm = new THREE.Mesh(
                new THREE.SphereGeometry(0.07, 8, 8),
                new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0xff3344 : 0x33ff88 })
            );
            lm.position.set(Math.cos(a) * 0.85, -0.05, Math.sin(a) * 0.85);
            ufoGroup.add(lm);
            ufoLights.push(lm);
        }

        const beamLight = new THREE.PointLight(0x88ccff, 1.5, 8, 2);
        beamLight.position.set(0, -0.5, 0);
        ufoGroup.add(beamLight);

        // ============================================================
        // 6. ШАРАЛЁТ С ПИНОМ — ИСПРАВЛЕННЫЙ ИЛЛЮМИНАТОР
        // ============================================================
        const sharalyotGroup = new THREE.Group();
        sharalyotGroup.position.set(0, 10, 0);
        scene.add(sharalyotGroup);

        const sharBodyMat = new THREE.MeshStandardMaterial({
            color: 0xdd4466, roughness: 0.35, metalness: 0.4,
            emissive: 0x330011, emissiveIntensity: 0.15,
            side: THREE.DoubleSide       // ← КЛЮЧЕВОЕ: двусторонний материал
        });

        // Корпус шаралёта — SphereGeometry с вырезанным сегментом для окна.
        // Используем несколько сегментов: основной шар + задняя часть.
        // Проще: сделаем основной шар, но с "дыркой" спереди через phiStart/phiLength.
        // Разрез делаем так: спереди вырезаем конус, где будет иллюминатор.
        // Для этого соберём корпус из 2 частей: задняя полусфера и переднее кольцо вокруг окна.
        
        // Задняя часть корпуса (большая)
        const sharBackGeo = new THREE.SphereGeometry(
            2.4, 48, 48,
            Math.PI * 0.75, Math.PI * 1.5,  // phiStart, phiLength — пропускаем переднюю зону
            0, Math.PI                       // thetaStart, thetaLength — вся высота
        );
        const sharBack = new THREE.Mesh(sharBackGeo, sharBodyMat);
        sharBack.castShadow = true;
        sharBack.receiveShadow = true;
        sharalyotGroup.add(sharBack);

        // Передняя часть корпуса — "кольцо" вокруг иллюминатора.
        // Это сфера с вырезанным сегментом по центру (только верх и низ окна).
        // Проще: сделаем 2 "полукольца" сверху и снизу окна.
        // Но ещё проще — сделаем переднюю часть как плоский "бублик" (тора), чтобы точно был проём.
        
        // Верхняя "губа" корпуса над окном
        const sharTopGeo = new THREE.SphereGeometry(
            2.4, 32, 16,
            Math.PI * 0.3, Math.PI * 0.4,   // phi
            0, Math.PI * 0.35               // theta — верхняя часть
        );
        const sharTop = new THREE.Mesh(sharTopGeo, sharBodyMat);
        sharTop.castShadow = true;
        sharalyotGroup.add(sharTop);

        // Нижняя "губа" корпуса под окном
        const sharBottomGeo = new THREE.SphereGeometry(
            2.4, 32, 16,
            Math.PI * 0.3, Math.PI * 0.4,
            Math.PI * 0.65, Math.PI * 0.35
        );
        const sharBottom = new THREE.Mesh(sharBottomGeo, sharBodyMat);
        sharBottom.castShadow = true;
        sharalyotGroup.add(sharBottom);

        // Обручи
        const hoopMat = new THREE.MeshStandardMaterial({
            color: 0xffcc33, roughness: 0.3, metalness: 0.9,
            emissive: 0x332200, emissiveIntensity: 0.3
        });

        const hoop1 = new THREE.Mesh(new THREE.TorusGeometry(2.42, 0.08, 12, 64), hoopMat);
        hoop1.rotation.x = Math.PI / 2;
        sharalyotGroup.add(hoop1);

        const hoop2 = new THREE.Mesh(new THREE.TorusGeometry(2.42, 0.08, 12, 64), hoopMat);
        sharalyotGroup.add(hoop2);

        const hoop3 = new THREE.Mesh(new THREE.TorusGeometry(2.42, 0.08, 12, 64), hoopMat);
        hoop3.rotation.z = Math.PI / 4; hoop3.rotation.y = Math.PI / 4;
        sharalyotGroup.add(hoop3);

        // ============================================================
        // ИЛЛЮМИНАТОР — рамка + полностью прозрачное стекло
        // ============================================================
        const winOuterMat = new THREE.MeshStandardMaterial({
            color: 0xcccccc, roughness: 0.3, metalness: 0.9
        });

        // Внешняя рамка иллюминатора (тор)
        const winFrame = new THREE.Mesh(
            new THREE.TorusGeometry(1.0, 0.15, 16, 48),
            winOuterMat
        );
        winFrame.position.set(0, 0.3, 2.4);
        winFrame.rotation.x = -0.15;
        winFrame.castShadow = true;
        sharalyotGroup.add(winFrame);

        // Внутреннее кольцо рамки
        const winFrameInner = new THREE.Mesh(
            new THREE.TorusGeometry(0.85, 0.06, 12, 48),
            winOuterMat
        );
        winFrameInner.position.set(0, 0.3, 2.38);
        winFrameInner.rotation.x = -0.15;
        sharalyotGroup.add(winFrameInner);

        // ПРОЗРАЧНОЕ СТЕКЛО — почти невидимое, только лёгкий отблеск
        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xaaddff,
            roughness: 0.0,
            metalness: 0.0,
            transmission: 1.0,           // полная прозрачность
            transparent: true,
            opacity: 0.25,               // минимум видимости, чтобы Пина было чётко видно
            thickness: 0.1,
            ior: 1.3,
            clearcoat: 1.0,
            clearcoatRoughness: 0.0,
            side: THREE.DoubleSide,
            depthWrite: false            // ← важно: не перекрывает объекты за собой
        });

        const glassDisc = new THREE.Mesh(
            new THREE.CircleGeometry(1.0, 48),
            glassMaterial
        );
        glassDisc.position.set(0, 0.3, 2.4);
        glassDisc.rotation.x = -0.15;
        sharalyotGroup.add(glassDisc);

        // Слабое голубое свечение стекла, чтобы читалось как окно
        const glowRing = new THREE.Mesh(
            new THREE.RingGeometry(0.9, 1.0, 48),
            new THREE.MeshBasicMaterial({
                color: 0x88ddff, transparent: true, opacity: 0.4,
                side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
            })
        );
        glowRing.position.set(0, 0.3, 2.42);
        glowRing.rotation.x = -0.15;
        sharalyotGroup.add(glowRing);

        // ============================================================
        // ПИН — ВНУТРИ, ВИДЕН ЧЕРЕЗ СТЕКЛО
        // ============================================================
        const pinGroup = new THREE.Group();
        // Пин стоит внутри, ближе к стеклу, лицом к нему (к +Z)
        // Окно на z = 2.4, значит Пин должен стоять на z ≈ 1.7, лицом к +Z
        pinGroup.position.set(0, 0.1, 1.6);
        sharalyotGroup.add(pinGroup);

        const pinBodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 });
        const pinBody = new THREE.Mesh(new THREE.SphereGeometry(0.75, 32, 32), pinBodyMat);
        pinBody.castShadow = true;
        pinGroup.add(pinBody);

        // Живот
        const pinBelly = new THREE.Mesh(
            new THREE.SphereGeometry(0.58, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 })
        );
        pinBelly.position.set(0, -0.08, 0.3);
        pinBelly.scale.set(1, 1.05, 0.55);
        pinGroup.add(pinBelly);

        // Клюв — торчит вперёд
        const beakMat = new THREE.MeshStandardMaterial({ color: 0xff8800, roughness: 0.5 });
        const beak = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.45, 16), beakMat);
        beak.position.set(0, 0.05, 0.78);
        beak.rotation.x = Math.PI / 2;
        pinGroup.add(beak);

        // Глаза Пина — большие, белые с чёрными зрачками
        const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
        const eyeBlackMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.2 });
        for (let i = -1; i <= 1; i += 2) {
            const eyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 20), eyeWhiteMat);
            eyeWhite.position.set(0.24 * i, 0.25, 0.55);
            pinGroup.add(eyeWhite);

            const eyeBlack = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 16), eyeBlackMat);
            eyeBlack.position.set(0.24 * i, 0.25, 0.73);
            pinGroup.add(eyeBlack);

            // Блик в глазу
            const shine = new THREE.Mesh(
                new THREE.SphereGeometry(0.04, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            shine.position.set(0.26 * i, 0.29, 0.82);
            pinGroup.add(shine);
        }

        // Крылья
        for (let i = -1; i <= 1; i += 2) {
            const wing = new THREE.Mesh(
                new THREE.SphereGeometry(0.28, 16, 16),
                pinBodyMat
            );
            wing.position.set(0.7 * i, -0.08, -0.05);
            wing.scale.set(0.6, 1.3, 0.45);
            pinGroup.add(wing);
        }

        // Лапки
        for (let i = -1; i <= 1; i += 2) {
            const leg = new THREE.Mesh(
                new THREE.CylinderGeometry(0.07, 0.07, 0.28, 8),
                beakMat
            );
            leg.position.set(0.22 * i, -0.7, 0.1);
            pinGroup.add(leg);

            const foot = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 12), beakMat);
            foot.position.set(0.22 * i, -0.85, 0.2);
            foot.scale.set(1.5, 0.6, 1.5);
            pinGroup.add(foot);
        }

        // Хохолок
        const crest = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.35, 8), pinBodyMat);
        crest.position.set(0, 0.8, 0.05);
        crest.rotation.x = -0.3;
        pinGroup.add(crest);

        // ============================================================
        // ДВИГАТЕЛИ ШАРАЛЁТА
        // ============================================================
        const thrusterMat = new THREE.MeshStandardMaterial({ color: 0x666677, roughness: 0.4, metalness: 0.9 });
        const thrusterPositions = [
            { x: 1.2, z: 1.2 }, { x: -1.2, z: 1.2 },
            { x: 1.2, z: -1.2 }, { x: -1.2, z: -1.2 }
        ];
        const sharFlames = [];

        thrusterPositions.forEach((p) => {
            const thruster = new THREE.Mesh(
                new THREE.CylinderGeometry(0.15, 0.28, 0.4, 12),
                thrusterMat
            );
            thruster.position.set(p.x, -2.15, p.z);
            thruster.rotation.x = Math.PI;
            sharalyotGroup.add(thruster);

            const flameGroup = new THREE.Group();
            const flameLayers = [
                { r: 0.18, h: 0.7, color: 0xffff88, op: 0.9, y: -0.35 },
                { r: 0.24, h: 1.1, color: 0xff8800, op: 0.6, y: -0.55 },
                { r: 0.32, h: 1.5, color: 0xff2200, op: 0.3, y: -0.75 }
            ];
            flameLayers.forEach((L) => {
                const f = new THREE.Mesh(
                    new THREE.ConeGeometry(L.r, L.h, 10),
                    new THREE.MeshBasicMaterial({
                        color: L.color, transparent: true, opacity: L.op,
                        blending: THREE.AdditiveBlending, depthWrite: false
                    })
                );
                f.rotation.x = Math.PI;
                f.position.y = L.y;
                flameGroup.add(f);
            });
            flameGroup.position.set(p.x, -2.35, p.z);
            flameGroup.userData.phase = Math.random() * Math.PI * 2;
            sharalyotGroup.add(flameGroup);
            sharFlames.push(flameGroup);
        });

        const sharLight = new THREE.PointLight(0xff8800, 2, 10, 2);
        sharLight.position.set(0, -2.5, 0);
        sharalyotGroup.add(sharLight);

        // ВНУТРЕННЯЯ ПОДСВЕТКА ШАРАЛЁТА — чтобы Пина было видно даже в темноте
        const innerLight = new THREE.PointLight(0xffeebb, 1.5, 5, 2);
        innerLight.position.set(0, 0.3, 1.0);
        sharalyotGroup.add(innerLight);

        // Антенна
        const antennaRod = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8, 8), hoopMat);
        antennaRod.position.set(0, 2.9, 0);
        sharalyotGroup.add(antennaRod);

        const antennaBall = new THREE.Mesh(
            new THREE.SphereGeometry(0.12, 16, 16),
            new THREE.MeshStandardMaterial({ color: 0xff4444, emissive: 0xff2222, emissiveIntensity: 1.5 })
        );
        antennaBall.position.set(0, 3.32, 0);
        sharalyotGroup.add(antennaBall);

        // ============================================================
        // 7. ФУНКЦИЯ СОЗДАНИЯ СМЕШАРИКА
        // ============================================================
        function createSmesharik(options) {
            const {
                bodyColor, bodyColor2, eyeCount = 2,
                beak = false, beakColor = 0xff8800,
                ears = false, earColor = null,
                horns = false, hornColor = 0x8b5a2b,
                patch = false, patchColor = 0xff8888,
                nose = false, noseColor = 0x222222,
                crest = false, crestColor = null,
                hair = false, hairColor = 0x000000,
                bow = false, bowColor = 0xff44aa,
                scale = 1
            } = options;

            const g = new THREE.Group();
            const bodyMatS = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.6, metalness: 0.05 });

            const body = new THREE.Mesh(new THREE.SphereGeometry(0.7 * scale, 32, 32), bodyMatS);
            body.castShadow = true;
            g.add(body);

            if (bodyColor2) {
                const belly = new THREE.Mesh(
                    new THREE.SphereGeometry(0.52 * scale, 32, 32),
                    new THREE.MeshStandardMaterial({ color: bodyColor2, roughness: 0.7 })
                );
                belly.position.set(0, -0.1 * scale, 0.25 * scale);
                belly.scale.set(1, 1.05, 0.55);
                g.add(belly);
            }

            const eyeWhiteMatS = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const eyeBlackMatS = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.2 });
            const eyeRadius = 0.2 * scale;

            for (let i = 0; i < eyeCount; i++) {
                const ex = eyeCount === 1 ? 0 : (i === 0 ? -0.25 : 0.25) * scale;
                const eyeWhite = new THREE.Mesh(new THREE.SphereGeometry(eyeRadius, 20, 20), eyeWhiteMatS);
                eyeWhite.position.set(ex, 0.15 * scale, 0.55 * scale);
                g.add(eyeWhite);

                const eyeBlack = new THREE.Mesh(new THREE.SphereGeometry(eyeRadius * 0.45, 16, 16), eyeBlackMatS);
                eyeBlack.position.set(ex, 0.15 * scale, 0.7 * scale);
                g.add(eyeBlack);
            }

            if (beak) {
                const beakMesh = new THREE.Mesh(
                    new THREE.ConeGeometry(0.13 * scale, 0.4 * scale, 16),
                    new THREE.MeshStandardMaterial({ color: beakColor, roughness: 0.5 })
                );
                beakMesh.position.set(0, -0.05 * scale, 0.72 * scale);
                beakMesh.rotation.x = Math.PI / 2;
                g.add(beakMesh);
            }

            if (patch) {
                const patchMesh = new THREE.Mesh(
                    new THREE.SphereGeometry(0.18 * scale, 20, 20),
                    new THREE.MeshStandardMaterial({ color: patchColor, roughness: 0.5 })
                );
                patchMesh.position.set(0, -0.05 * scale, 0.7 * scale);
                patchMesh.scale.set(1.2, 1, 0.6);
                g.add(patchMesh);

                const dotMat = new THREE.MeshStandardMaterial({ color: 0xaa3355 });
                for (let i = -1; i <= 1; i += 2) {
                    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.03 * scale, 8, 8), dotMat);
                    dot.position.set(0.06 * i * scale, -0.05 * scale, 0.82 * scale);
                    g.add(dot);
                }
            }

            if (nose) {
                const noseMesh = new THREE.Mesh(
                    new THREE.SphereGeometry(0.09 * scale, 16, 16),
                    new THREE.MeshStandardMaterial({ color: noseColor, roughness: 0.3 })
                );
                noseMesh.position.set(0, -0.05 * scale, 0.72 * scale);
                g.add(noseMesh);
            }

            if (ears) {
                const earMatS = new THREE.MeshStandardMaterial({ color: earColor || bodyColor, roughness: 0.6 });
                const earShape = options.earLong ? 0.5 : 0.35;
                for (let i = -1; i <= 1; i += 2) {
                    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.13 * scale, 16, 16), earMatS);
                    ear.position.set(0.3 * i * scale, 0.65 * scale, 0);
                    ear.scale.set(1, (earShape / 0.13) * 0.5, 0.6);
                    ear.castShadow = true;
                    g.add(ear);
                }
            }

            if (horns) {
                const hornMatS = new THREE.MeshStandardMaterial({ color: hornColor, roughness: 0.7 });
                if (options.hornType === 'ram') {
                    for (let i = -1; i <= 1; i += 2) {
                        const hornGroup = new THREE.Group();
                        for (let j = 0; j < 4; j++) {
                            const seg = new THREE.Mesh(
                                new THREE.TorusGeometry(0.15 * scale + j * 0.03 * scale, 0.05 * scale, 8, 12, Math.PI / 1.5),
                                hornMatS
                            );
                            seg.rotation.y = j * 0.8;
                            seg.rotation.z = 0.3 * j;
                            hornGroup.add(seg);
                        }
                        hornGroup.position.set(0.35 * i * scale, 0.75 * scale, 0);
                        hornGroup.rotation.z = i * 0.5;
                        g.add(hornGroup);
                    }
                } else {
                    for (let i = -1; i <= 1; i += 2) {
                        const hornGroup = new THREE.Group();
                        const base = new THREE.Mesh(
                            new THREE.CylinderGeometry(0.06 * scale, 0.08 * scale, 0.4 * scale, 8),
                            hornMatS
                        );
                        base.position.y = 0.2 * scale;
                        hornGroup.add(base);

                        const branch1 = new THREE.Mesh(
                            new THREE.CylinderGeometry(0.04 * scale, 0.05 * scale, 0.3 * scale, 8),
                            hornMatS
                        );
                        branch1.position.set(0.1 * scale, 0.45 * scale, 0);
                        branch1.rotation.z = -0.8;
                        hornGroup.add(branch1);

                        const branch2 = new THREE.Mesh(
                            new THREE.CylinderGeometry(0.035 * scale, 0.05 * scale, 0.3 * scale, 8),
                            hornMatS
                        );
                        branch2.position.set(-0.1 * scale, 0.45 * scale, 0);
                        branch2.rotation.z = 0.8;
                        hornGroup.add(branch2);

                        hornGroup.position.set(0.28 * i * scale, 0.7 * scale, 0);
                        hornGroup.rotation.z = i * 0.3;
                        g.add(hornGroup);
                    }
                }
            }

            if (crest) {
                const crestMatS = new THREE.MeshStandardMaterial({ color: crestColor || bodyColor, roughness: 0.6 });
                const crestMesh = new THREE.Mesh(new THREE.ConeGeometry(0.07 * scale, 0.3 * scale, 8), crestMatS);
                crestMesh.position.set(0, 0.72 * scale, 0.05 * scale);
                crestMesh.rotation.x = -0.25;
                g.add(crestMesh);
            }

            if (hair) {
                const hairMatS = new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.5 });
                for (let i = 0; i < 3; i++) {
                    const curl = new THREE.Mesh(new THREE.SphereGeometry(0.1 * scale, 12, 12), hairMatS);
                    curl.position.set((i - 1) * 0.13 * scale, 0.75 * scale, 0.05 * scale);
                    g.add(curl);
                }
            }

            if (bow) {
                const bowMatS = new THREE.MeshStandardMaterial({ color: bowColor, roughness: 0.4 });
                for (let i = -1; i <= 1; i += 2) {
                    const petal = new THREE.Mesh(new THREE.SphereGeometry(0.1 * scale, 12, 12), bowMatS);
                    petal.position.set(0.4 * i * scale, 0.55 * scale, 0.2 * scale);
                    petal.scale.set(1, 0.7, 0.5);
                    g.add(petal);
                }
                const center = new THREE.Mesh(new THREE.SphereGeometry(0.05 * scale, 10, 10), bowMatS);
                center.position.set(0, 0.55 * scale, 0.25 * scale);
                g.add(center);
            }

            const limbMatS = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.6 });
            for (let i = -1; i <= 1; i += 2) {
                const arm = new THREE.Mesh(new THREE.SphereGeometry(0.14 * scale, 16, 16), limbMatS);
                arm.position.set(0.65 * i * scale, -0.1 * scale, 0);
                arm.scale.set(0.8, 1.2, 0.7);
                arm.castShadow = true;
                g.add(arm);

                const leg = new THREE.Mesh(new THREE.SphereGeometry(0.12 * scale, 16, 16), limbMatS);
                leg.position.set(0.28 * i * scale, -0.62 * scale, 0);
                leg.scale.set(1, 0.7, 1);
                g.add(leg);

                const foot = new THREE.Mesh(new THREE.SphereGeometry(0.13 * scale, 16, 16), limbMatS);
                foot.position.set(0.28 * i * scale, -0.72 * scale, 0.08 * scale);
                foot.scale.set(1.3, 0.5, 1.5);
                g.add(foot);
            }

            return g;
        }

        // ============================================================
        // 8. СОЗДАЁМ ВСЕХ СМЕШАРИКОВ
        // ============================================================
        const krosh = createSmesharik({
            bodyColor: 0x66ccff, bodyColor2: 0xffffff,
            ears: true, earLong: true, earColor: 0x66ccff,
            nose: true, noseColor: 0xff88aa,
            scale: 1.0
        });

        const yozhik = createSmesharik({
            bodyColor: 0x9955cc, bodyColor2: 0xddbbff,
            ears: true, earColor: 0x9955cc,
            nose: true, noseColor: 0x222222,
            scale: 0.95
        });
        const yozhikNeedles = new THREE.Group();
        const needleMat = new THREE.MeshStandardMaterial({ color: 0x552277, roughness: 0.7 });
        for (let i = 0; i < 8; i++) {
            const needle = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.25, 6), needleMat);
            const angle = (i / 8) * Math.PI * 2;
            needle.position.set(Math.cos(angle) * 0.55, 0.3, Math.sin(angle) * 0.35);
            needle.rotation.x = -Math.PI / 3;
            needle.rotation.z = Math.cos(angle) * 0.5;
            yozhikNeedles.add(needle);
        }
        yozhik.add(yozhikNeedles);

        const nyusha = createSmesharik({
            bodyColor: 0xff99cc, bodyColor2: 0xffccdd,
            patch: true, patchColor: 0xff6699,
            hair: true, hairColor: 0xaa2244,
            bow: true, bowColor: 0xff44aa,
            scale: 1.0
        });

        const barash = createSmesharik({
            bodyColor: 0xcc99ff, bodyColor2: 0xf0e0ff,
            horns: true, hornType: 'ram', hornColor: 0x886644,
            nose: true, noseColor: 0x222222,
            scale: 1.0
        });

        const kopatych = createSmesharik({
            bodyColor: 0xaa6633, bodyColor2: 0xddaa77,
            ears: true, earColor: 0xaa6633,
            nose: true, noseColor: 0x222222,
            scale: 1.05
        });

        const sovunya = createSmesharik({
            bodyColor: 0x4466aa, bodyColor2: 0x88aadd,
            beak: true, beakColor: 0xffaa33,
            ears: true, earColor: 0x4466aa,
            scale: 1.0
        });

        const losyash = createSmesharik({
            bodyColor: 0xffcc44, bodyColor2: 0xffeeaa,
            horns: true, hornType: 'moose', hornColor: 0x8b5a2b,
            nose: true, noseColor: 0x222222,
            scale: 1.05
        });

        // ============================================================
        // 9. СКАФАНДРЫ
        // ============================================================
        const suitMat = new THREE.MeshPhysicalMaterial({
            color: 0x88ddff,
            roughness: 0.1, metalness: 0.0,
            transmission: 0.85, transparent: true, opacity: 0.32,
            thickness: 0.5, ior: 1.3, clearcoat: 0.8,
            side: THREE.DoubleSide
        });
        const suitRingMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.3, metalness: 0.9 });
        const backpackMat = new THREE.MeshStandardMaterial({ color: 0x888899, roughness: 0.5, metalness: 0.7 });

        function addSpaceSuit(smesharikGroup, scale = 1) {
            const bubble = new THREE.Mesh(new THREE.SphereGeometry(1.1 * scale, 32, 32), suitMat);
            bubble.position.set(0, 0.05 * scale, 0);
            smesharikGroup.add(bubble);

            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.65 * scale, 0.06 * scale, 12, 32), suitRingMat);
            ring.position.set(0, 0.1 * scale, 0);
            ring.rotation.x = Math.PI / 2;
            smesharikGroup.add(ring);

            const backpack = new THREE.Mesh(new THREE.BoxGeometry(0.4 * scale, 0.55 * scale, 0.25 * scale), backpackMat);
            backpack.position.set(0, 0.1 * scale, -0.85 * scale);
            smesharikGroup.add(backpack);

            const flamesArray = [];
            for (let i = -1; i <= 1; i += 2) {
                const thr = new THREE.Mesh(new THREE.CylinderGeometry(0.06 * scale, 0.09 * scale, 0.2 * scale, 10), backpackMat);
                thr.position.set(0.22 * i * scale, -0.55 * scale, -0.6 * scale);
                thr.rotation.x = Math.PI;
                smesharikGroup.add(thr);

                const lf = new THREE.Mesh(
                    new THREE.ConeGeometry(0.07 * scale, 0.35 * scale, 8),
                    new THREE.MeshBasicMaterial({
                        color: 0x88ddff, transparent: true, opacity: 0.7,
                        blending: THREE.AdditiveBlending, depthWrite: false
                    })
                );
                lf.rotation.x = Math.PI;
                lf.position.set(0.22 * i * scale, -0.75 * scale, -0.6 * scale);
                lf.userData.phase = Math.random() * Math.PI * 2;
                smesharikGroup.add(lf);
                flamesArray.push(lf);
            }
            return flamesArray;
        }

        // ============================================================
        // 10. РАСПОЛАГАЕМ СМЕШАРИКОВ ВОКРУГ ШАРАЛЁТА
        // ============================================================
        const crewGroup = new THREE.Group();
        crewGroup.position.set(0, 10, 0);
        scene.add(crewGroup);

        const crewMembers = [
            { model: krosh,    angle: 0,           radius: 5.5, height: 0.5 },
            { model: yozhik,   angle: Math.PI/4,   radius: 5.5, height: -0.3 },
            { model: nyusha,   angle: Math.PI/2,   radius: 5.5, height: 0.4 },
            { model: barash,   angle: 3*Math.PI/4, radius: 5.5, height: -0.2 },
            { model: kopatych, angle: Math.PI,     radius: 5.5, height: 0.3 },
            { model: sovunya,  angle: 5*Math.PI/4, radius: 5.5, height: -0.4 },
            { model: losyash,  angle: 3*Math.PI/2, radius: 5.5, height: 0.5 }
        ];

        const allCrewFlames = [];

        crewMembers.forEach((m) => {
            const x = Math.cos(m.angle) * m.radius;
            const z = Math.sin(m.angle) * m.radius;
            m.model.position.set(x, m.height, z);
            m.model.lookAt(0, 0, 0);
            crewGroup.add(m.model);

            const flamesOfSuit = addSpaceSuit(m.model, 1.0);
            allCrewFlames.push(...flamesOfSuit);
        });

        // ============================================================
        // 11. ЗВЁЗДЫ
        // ============================================================
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 3500;
        const starsPos = new Float32Array(starsCount * 3);
        const starsCol = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount; i++) {
            const i3 = i * 3;
            starsPos[i3] = (Math.random() - 0.5) * 1200;
            starsPos[i3 + 1] = (Math.random() - 0.5) * 1200;
            starsPos[i3 + 2] = (Math.random() - 0.5) * 1200;

            const c = new THREE.Color().setHSL(0.55 + Math.random() * 0.2, 0.5, 0.7 + Math.random() * 0.3);
            starsCol[i3] = c.r;
            starsCol[i3 + 1] = c.g;
            starsCol[i3 + 2] = c.b;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        starsGeo.setAttribute('color', new THREE.BufferAttribute(starsCol, 3));

        const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({
            size: 0.6, vertexColors: true, transparent: true, opacity: 0.9,
            blending: THREE.AdditiveBlending, sizeAttenuation: true
        }));
        scene.add(stars);

        // ============================================================
        // 12. СОЗВЕЗДИЕ МАЛОЙ МЕДВЕДИЦЫ
        // ============================================================
        const ursaMinorGroup = new THREE.Group();
        ursaMinorGroup.position.set(-25, 38, -80);
        ursaMinorGroup.rotation.z = -0.25;
        scene.add(ursaMinorGroup);

        const ursaMinorStars = [
            { x: 0.0, y: 0.0, size: 0.55 },
            { x: 1.2, y: 1.0, size: 0.30 },
            { x: 2.4, y: 2.0, size: 0.32 },
            { x: 3.6, y: 3.0, size: 0.38 },
            { x: 3.2, y: 4.4, size: 0.42 },
            { x: 4.8, y: 5.0, size: 0.45 },
            { x: 5.6, y: 3.8, size: 0.40 }
        ];
        const lineOrder = [0, 1, 2, 3, 4, 5, 6, 3];
        const starColors = [0xffffff, 0xaaddff, 0xffeebb, 0xffffff, 0xffeedd, 0xccddff, 0xffffff];
        const starMeshes = [];

        ursaMinorStars.forEach((s, i) => {
            const star = new THREE.Mesh(
                new THREE.SphereGeometry(s.size, 16, 16),
                new THREE.MeshBasicMaterial({ color: starColors[i], transparent: true, opacity: 0.95 })
            );
            star.position.set(s.x, s.y, 0);
            ursaMinorGroup.add(star);
            starMeshes.push(star);

            const glow = new THREE.Mesh(
                new THREE.SphereGeometry(s.size * 2.2, 16, 16),
                new THREE.MeshBasicMaterial({
                    color: starColors[i], transparent: true, opacity: 0.15,
                    blending: THREE.AdditiveBlending, depthWrite: false
                })
            );
            glow.position.copy(star.position);
            ursaMinorGroup.add(glow);
        });

        starMeshes[0].scale.setScalar(1.3);

        const linePoints = lineOrder.map((idx) => new THREE.Vector3(ursaMinorStars[idx].x, ursaMinorStars[idx].y, 0));
        const lineGeo = new THREE.BufferGeometry().setFromPoints(linePoints);
        const constellationLine = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({
            color: 0x88bbff, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending
        }));
        ursaMinorGroup.add(constellationLine);

        // ============================================================
        // 13. АНИМАЦИЯ
        // ============================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            // Ракета
            flames.forEach((flame) => {
                const sY = 1 + Math.sin(elapsed * 15 + flame.userData.phase) * 0.15;
                const sXZ = 1 + Math.sin(elapsed * 12 + flame.userData.phase) * 0.1;
                flame.scale.set(sXZ, sY, sXZ);
                flame.children.forEach((child, i) => {
                    if (child.material) {
                        child.material.opacity = (0.4 + Math.random() * 0.4) * (i === 0 ? 1 : i === 1 ? 0.8 : 0.5);
                    }
                });
            });
            engineLight.intensity = 2.5 + Math.sin(elapsed * 20) * 0.8;

            // Шаралёт
            sharFlames.forEach((flame) => {
                const sY = 1 + Math.sin(elapsed * 18 + flame.userData.phase) * 0.2;
                const sXZ = 1 + Math.sin(elapsed * 14 + flame.userData.phase) * 0.15;
                flame.scale.set(sXZ, sY, sXZ);
            });
            sharLight.intensity = 1.8 + Math.sin(elapsed * 22) * 0.7;
            innerLight.intensity = 1.3 + Math.sin(elapsed * 3) * 0.3;

            sharalyotGroup.position.y = 10 + Math.sin(elapsed * 0.8) * 0.4;
            sharalyotGroup.rotation.y = Math.sin(elapsed * 0.4) * 0.15;

            // Пин слегка крутит головой
            pinGroup.rotation.y = Math.sin(elapsed * 0.6) * 0.25;
            pinGroup.rotation.x = Math.sin(elapsed * 0.4) * 0.08;

            antennaBall.material.emissiveIntensity = 0.8 + Math.sin(elapsed * 6) * 0.8;

            // Скафандры
            allCrewFlames.forEach((f) => {
                const s = 1 + Math.sin(elapsed * 20 + f.userData.phase) * 0.25;
                f.scale.set(s, s, s);
            });

            // Смешарики
            crewMembers.forEach((m, i) => {
                const baseY = m.height;
                m.model.position.y = baseY + Math.sin(elapsed * 0.7 + i * 1.3) * 0.25;
                m.model.rotation.z = Math.sin(elapsed * 0.5 + i) * 0.08;
            });

            crewGroup.rotation.y += 0.0015;

            // Пришельцы
            aliens.forEach((alien) => {
                const phase = alien.userData.phase;
                alien.position.y = alien.userData.baseY + Math.sin(elapsed * 3 + phase) * 0.08;
                alien.rotation.y += Math.sin(elapsed * 2 + phase) * 0.005;
            });

            moonGroup.rotation.y += 0.0008;

            // НЛО
            ufoGroup.rotation.y += 0.02;
            ufoGroup.position.y = 6 + Math.sin(elapsed * 1.5) * 0.4;
            ufoGroup.rotation.z = Math.sin(elapsed * 0.8) * 0.1;

            ufoLights.forEach((light, i) => {
                const flash = Math.sin(elapsed * 5 + i * 0.8);
                light.material.color.setHex(flash > 0 ? (i % 2 === 0 ? 0xff3344 : 0x33ff88) : 0x222222);
            });

            beamLight.intensity = 1.2 + Math.sin(elapsed * 4) * 0.6;

            stars.rotation.y += 0.0001;
            ursaMinorGroup.rotation.z += 0.00005;

            starMeshes.forEach((star, i) => {
                star.material.opacity = 0.85 + Math.sin(elapsed * (2 + i * 0.3) + i) * 0.15;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // ============================================================
        // 14. RESIZE
        // ============================================================
        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }

        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => setTimeout(onResize, 200));
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', onResize);
        }

        // ============================================================
        // СТАРТ
        // ============================================================
        animate();

        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
        }, 400);

        console.log('🌟 Пин виден через иллюминатор!');
    </script>
</body>
</html>
